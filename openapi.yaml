---
openapi: 3.0.0
info:
  title: DoorFlow API
  version: '3.0'
  description: Access control and door management API for DoorFlow
  contact:
    name: DoorFlow Support
    url: https://doorflow.com
servers:
- url: https://api.doorflow.com
  description: Production server
paths:
  "/api/3/account":
    get:
      summary: Get current account details
      description: Returns the account information for the authenticated user
      operationId: getAccount
      tags:
      - accounts
      security:
      - OAuth2: []
      responses:
        '200':
          description: Account details retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '401':
          description: Unauthorized - Invalid or missing authentication
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Forbidden - User does not have permission
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/3/admission_requests/{id}":
    get:
      summary: Get admission request status
      description: |
        Returns the status of an admission request created via POST /api/3/channels/:id/admit or
        POST /api/3/channels/:id/admit_person. Use this to track whether the admission was successful,
        denied, or is still pending a response from the door controller.
      operationId: getAdmissionRequest
      tags:
      - admission_requests
      security:
      - OAuth2:
        - account.channel.admit
        - account.channel.admit.person
      parameters:
      - name: id
        in: path
        description: Admission request ID (Event ID returned from admit/admit_person
          endpoints)
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Admission request status retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdmissionRequest"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/channels":
    get:
      summary: List channels (door controllers)
      description: Returns a paginated list of channels (door controllers) accessible
        to the authenticated user
      operationId: listChannels
      tags:
      - channels
      security:
      - OAuth2:
        - account.channel.readonly
      parameters:
      - name: site_id
        in: query
        description: Filter channels by site ID
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Number of results per page
        required: false
        schema:
          type: integer
          default: 500
          maximum: 1000
      - name: page
        in: query
        description: Page number for pagination
        required: false
        schema:
          type: integer
          default: 1
      - name: skip_pagination
        in: query
        description: Skip pagination and return all results
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: List of channels retrieved successfully
          headers:
            Total:
              schema:
                type: integer
              description: Total number of records
            Per-Page:
              schema:
                type: integer
              description: Number of records per page
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Channel"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
  "/api/3/channels/{id}":
    get:
      summary: Get channel details
      description: Returns details for a specific channel (door controller)
      operationId: getChannel
      tags:
      - channels
      security:
      - OAuth2:
        - account.channel.readonly
      parameters:
      - name: id
        in: path
        description: Channel ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Channel details retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Channel"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
  "/api/3/channels/{id}/admit":
    post:
      summary: Admit through channel (any person)
      description: |
        Requests immediate admission through a channel without specifying a person.
        This creates an admission request that momentarily unlocks the door.
        Returns an admission_request_id that can be used to track the status via GET /api/3/admission_requests/:id.
        Only works when the channel is in normal mode (not in unlock mode).
      operationId: admitChannel
      tags:
      - channels
      security:
      - OAuth2:
        - account.channel.admit
      parameters:
      - name: id
        in: path
        description: Channel ID
        required: true
        schema:
          type: integer
      responses:
        '202':
          description: Admission request accepted and queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  admission_request_id:
                    type: integer
                    description: ID of the admission request (Event ID) for status
                      tracking
                    example: 123456789
                  status:
                    type: string
                    enum:
                    - pending
                    - admitted
                    - denied
                    - offline
                    description: Initial status of the admission request
                    example: pending
        '400':
          description: Bad Request - Channel not in normal mode or request cannot
            be processed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Channel"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/channels/{id}/admit_person":
    post:
      summary: Admit specific person through channel
      description: |
        Requests admission for a specific person through a channel.
        This checks if the person has valid credentials and access rights before admitting.
        Returns an admission_request_id for tracking via GET /api/3/admission_requests/:id.
      operationId: admitPerson
      tags:
      - channels
      security:
      - OAuth2:
        - account.channel.admit.person
      parameters:
      - name: id
        in: path
        description: Channel ID
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - person_id
              properties:
                person_id:
                  type: integer
                  description: ID of the person to admit
                  example: 12345
      responses:
        '202':
          description: Admission request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  admission_request_id:
                    type: integer
                    description: ID of the admission request for status tracking
                    example: 123456789
                  status:
                    type: string
                    enum:
                    - pending
                    - admitted
                    - denied
                    - offline
                    description: Initial status of the admission
                    example: pending
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          description: Forbidden - Person does not have access or is not authorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Access denied
                  reason:
                    type: string
                    description: Reason for denial
                    example: Person does not have valid credentials for this channel
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/channels/{id}/lockdown":
    post:
      summary: Enable lockdown mode
      description: |
        Puts a channel into lockdown mode, restricting various types of access.
        You can selectively lock down card access, REX (Request to Exit), and AUX inputs.
      operationId: lockdownChannel
      tags:
      - channels
      security:
      - OAuth2:
        - account.channel.admit
      parameters:
      - name: id
        in: path
        description: Channel ID
        required: true
        schema:
          type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                card_lockdown:
                  type: boolean
                  description: Lock down card access
                  example: true
                rex_lockdown:
                  type: boolean
                  description: Lock down REX (Request to Exit)
                  example: false
                aux_lockdown:
                  type: boolean
                  description: Lock down AUX inputs
                  example: false
      responses:
        '200':
          description: Lockdown mode enabled successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Channel"
        '400':
          description: Bad Request - Lockdown command failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Channel"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/channels/{id}/unlockdown":
    post:
      summary: Disable lockdown mode
      description: Removes lockdown mode from a channel, restoring normal access control
      operationId: unlockdownChannel
      tags:
      - channels
      security:
      - OAuth2:
        - account.channel.admit
      parameters:
      - name: id
        in: path
        description: Channel ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Lockdown mode disabled successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Channel"
        '400':
          description: Bad Request - Unlockdown command failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Channel"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/channels/{id}/unlock":
    post:
      summary: Unlock channel (unlock mode)
      description: |
        Puts a channel into unlock mode, where the door remains unlocked until a specified time.
        If no relock_at time is provided, the door remains unlocked until normal mode is restored.
      operationId: unlockChannel
      tags:
      - channels
      security:
      - OAuth2:
        - account.channel.admit
      parameters:
      - name: id
        in: path
        description: Channel ID
        required: true
        schema:
          type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                relock_at:
                  type: string
                  format: date-time
                  description: Time when door should automatically relock (optional)
                  example: '2024-01-15T17:00:00Z'
      responses:
        '200':
          description: Channel unlocked successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Channel"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/channels/{id}/normal":
    post:
      summary: Return channel to normal mode
      description: Cancels unlock mode and returns the channel to normal access control
        mode
      operationId: normalChannel
      tags:
      - channels
      security:
      - OAuth2:
        - account.channel.admit
      parameters:
      - name: id
        in: path
        description: Channel ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Channel returned to normal mode successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Channel"
        '400':
          description: Bad Request - Command failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Channel"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/channels/{id}/auto_unlock":
    post:
      summary: Set auto-unlock shift
      description: |
        Configures a shift during which the channel automatically unlocks.
        Provide a shift_id to enable auto-unlock, or omit it to disable.
      operationId: autoUnlockChannel
      tags:
      - channels
      security:
      - OAuth2:
        - account.channel.admit
      parameters:
      - name: id
        in: path
        description: Channel ID
        required: true
        schema:
          type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                shift_id:
                  type: integer
                  nullable: true
                  description: ID of shift for auto-unlock (null or omit to disable)
                  example: 10
      responses:
        '200':
          description: Auto-unlock configuration updated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Channel"
        '400':
          description: Bad Request - Invalid shift_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: No shift found for shift_id - 999
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/channels/{id}/regenerate_encryption_key":
    post:
      summary: Regenerate encryption key
      description: Generates a new encryption key for secure communication with the
        channel
      operationId: regenerateEncryptionKey
      tags:
      - channels
      security:
      - OAuth2:
        - account.channel.admit
      parameters:
      - name: id
        in: path
        description: Channel ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Encryption key regenerated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Channel"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/channels/{id}/remove_encryption_key":
    post:
      summary: Remove encryption key
      description: Removes the encryption key, disabling encrypted communication with
        the channel
      operationId: removeEncryptionKey
      tags:
      - channels
      security:
      - OAuth2:
        - account.channel.admit
      parameters:
      - name: id
        in: path
        description: Channel ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Encryption key removed successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Channel"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/card_designs":
    get:
      summary: List card designs
      description: Returns all card designs for the authenticated user's account.
      operationId: listCardDesigns
      tags:
      - card_designs
      security:
      - OAuth2:
        - account.card_design.readonly
      responses:
        '200':
          description: List of card designs retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/CardDesign"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
    post:
      summary: Create card design
      description: Creates a new card design. Images can be provided as base64-encoded strings.
      operationId: createCardDesign
      tags:
      - card_designs
      security:
      - OAuth2:
        - account.card_design
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CardDesignInput"
      responses:
        '201':
          description: Card design created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CardDesign"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '422':
          "$ref": "#/components/responses/UnprocessableEntityError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/card_designs/{id}":
    get:
      summary: Get card design
      description: Returns details for a specific card design including image URLs at multiple sizes.
      operationId: getCardDesign
      tags:
      - card_designs
      security:
      - OAuth2:
        - account.card_design.readonly
      parameters:
      - name: id
        in: path
        description: Card Design ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Card design retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CardDesign"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
    put:
      summary: Update card design
      description: Updates an existing card design. Images can be replaced by providing new base64-encoded strings.
      operationId: updateCardDesign
      tags:
      - card_designs
      security:
      - OAuth2:
        - account.card_design
      parameters:
      - name: id
        in: path
        description: Card Design ID
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CardDesignInput"
      responses:
        '200':
          description: Card design updated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CardDesign"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '422':
          "$ref": "#/components/responses/UnprocessableEntityError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
    delete:
      summary: Delete card design
      description: Permanently deletes a card design and its associated images.
      operationId: deleteCardDesign
      tags:
      - card_designs
      security:
      - OAuth2:
        - account.card_design
      parameters:
      - name: id
        in: path
        description: Card Design ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Card design deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: ok
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/credential_types":
    get:
      summary: List credential types
      description: |
        Returns a paginated list of credential types configured for the authenticated user's account.
        Credential types define the formats and types of credentials (cards, PINs, mobile access, etc.) that can be used.
        Each credential type is based on a global credential type and can be customized per account.
      operationId: listCredentialTypes
      tags:
      - credential_types
      security:
      - OAuth2:
        - account.credential_type.readonly
      parameters:
      - name: per_page
        in: query
        description: Number of results per page
        required: false
        schema:
          type: integer
          default: 500
      - name: page
        in: query
        description: Page number for pagination
        required: false
        schema:
          type: integer
          default: 1
      - name: skip_pagination
        in: query
        description: Skip pagination and return all results
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: List of credential types retrieved successfully
          headers:
            Total:
              schema:
                type: integer
              description: Total number of records
            Per-Page:
              schema:
                type: integer
              description: Number of records per page
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/CredentialType"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/people/{person_id}/credentials":
    get:
      summary: List person credentials
      description: Returns a paginated list of credentials for a specific person,
        or all credentials if no person_id is provided
      operationId: listPersonCredentials
      tags:
      - credentials
      security:
      - OAuth2:
        - account.person.readonly
      parameters:
      - name: person_id
        in: path
        description: Person ID
        required: true
        schema:
          type: integer
      - name: per_page
        in: query
        description: Number of results per page
        required: false
        schema:
          type: integer
          default: 500
      - name: page
        in: query
        description: Page number for pagination
        required: false
        schema:
          type: integer
          default: 1
      - name: skip_pagination
        in: query
        description: Skip pagination and return all results
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: List of credentials retrieved successfully
          headers:
            Total:
              schema:
                type: integer
              description: Total number of records
            Per-Page:
              schema:
                type: integer
              description: Number of records per page
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Credential"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
    post:
      summary: Create credential
      description: Creates a new credential for a person. For HID Mobile Access and
        PassFlow credentials, this initiates an invitation process.
      operationId: createCredential
      tags:
      - credentials
      security:
      - OAuth2:
        - account.person
      parameters:
      - name: person_id
        in: path
        description: Person ID
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CredentialInput"
      responses:
        '201':
          description: Credential created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Credential"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '409':
          description: Conflict - Credential already exists for this credential type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Credential"
        '422':
          "$ref": "#/components/responses/UnprocessableEntityError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/people/{person_id}/credentials/{id}":
    get:
      summary: Get credential details
      description: Returns details for a specific credential
      operationId: getCredential
      tags:
      - credentials
      security:
      - OAuth2:
        - account.person.readonly
      parameters:
      - name: person_id
        in: path
        description: Person ID
        required: true
        schema:
          type: integer
      - name: id
        in: path
        description: Credential ID (hashid) or HID invitation ID (format 99xxxxxxxx)
        required: true
        schema:
          type: string
      - name: callback
        in: query
        description: Webhook callback ID for acknowledgment
        required: false
        schema:
          type: string
      - name: ack_token
        in: query
        description: Webhook acknowledgment token
        required: false
        schema:
          type: string
      responses:
        '200':
