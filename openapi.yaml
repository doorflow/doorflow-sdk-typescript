    Reservation:
      type: object
      required:
      - id
      - person_id
      - start_time
      - end_time
      - channel_ids
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          description: Unique identifier for the reservation
          example: 789
        person_id:
          type: integer
          description: ID of the person granted temporary access
          example: 12345
        start_time:
          type: string
          format: date-time
          description: Start time of the reservation
          example: '2024-01-15T09:00:00.000Z'
        end_time:
          type: string
          format: date-time
          description: End time of the reservation (must be after start time and on
            the same day)
          example: '2024-01-15T17:00:00.000Z'
        channel_ids:
          type: array
          description: Array of channel (door controller) IDs the person has access
            to during this reservation
          items:
            type: integer
          example:
          - 1340
          - 1341
        created_at:
          type: string
          format: date-time
          description: Timestamp of creation
        updated_at:
          type: string
          format: date-time
          description: Timestamp of last update
    ReservationInput:
      type: object
      required:
      - person_id
      - start_time
      - end_time
      properties:
        person_id:
          type: integer
          description: ID of the person to grant temporary access (must belong to
            the same account)
          example: 12345
        start_time:
          type: string
          format: date-time
          description: Start time of the reservation
          example: '2024-01-15T09:00:00.000Z'
        end_time:
          type: string
          format: date-time
          description: End time of the reservation (must be after start time and on
            the same day in account time zone)
          example: '2024-01-15T17:00:00.000Z'
        channel_ids:
          type: array
          description: Array of channel IDs to grant access to (at least one required,
            all must be accessible to the creator)
          items:
            type: integer
          minItems: 1
          example:
          - 1340
          - 1341
        door_controller_ids:
          type: array
          description: Alias for channel_ids
          items:
            type: integer
          minItems: 1
          example:
          - 1340
          - 1341
    Role:
      type: object
      required:
      - id
      - name
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          description: Unique identifier for the role
          example: 42
        name:
          type: string
          description: Name of the role (must be unique within the account)
          example: Office Staff
        shift_id:
          type: integer
          nullable: true
          description: ID of the shift defining when this role grants access (null
            means 24/7 access)
          example: 10
        notes:
          type: string
          nullable: true
          description: Additional notes about this role
          example: Access to main building during business hours
        created_at:
          type: string
          format: date-time
          description: Timestamp of creation
        updated_at:
          type: string
          format: date-time
          description: Timestamp of last update
    Site:
      type: object
      required:
      - id
      - name
      - site_ips
      properties:
        id:
          type: integer
          description: Unique identifier for the site
          example: 25
        name:
          type: string
          description: Name of the site (required)
          example: Main Office
        ip_address:
          type: string
          nullable: true
          description: Primary IP address for the site (deprecated - use site_ips
            instead)
          example: 192.168.1.0/24
        time_zone:
          type: string
          nullable: true
          description: IANA time zone identifier for this site
          example: America/New_York
        notes:
          type: string
          nullable: true
          description: Additional notes about this site
          example: Corporate headquarters building
        site_ips:
          type: array
          description: Array of IP address ranges associated with this site
          items:
            type: object
            properties:
              ip_address:
                type: string
                description: IP address or CIDR range
                example: 192.168.1.0/24
    CardTemplate:
      type: object
      required:
      - id
      - uuid
      - name
      - template_type_code
      properties:
        id:
          type: integer
          description: Server-assigned identifier
          example: 42
        uuid:
          type: string
          description: Client-generated UUID (RFC 4122)
          example: 550E8400-E29B-41D4-A716-446655440000
        name:
          type: string
          description: Template display name, unique per account
          example: Staff Card
        template_type_code:
          type: string
          description: References a template type code
          example: ISO_CARD
        card_type:
          type: string
          description: Card finish/format
          enum:
          - standard
          - signature_stripe
          example: standard
        double_sided:
          type: boolean
          description: Whether the card has a reverse side
          example: true
        orientation_front:
          type: string
          description: "P = Portrait, L = Landscape"
          enum:
          - P
          - L
          example: P
        orientation_back:
          type: string
          description: "P = Portrait, L = Landscape"
          enum:
          - P
          - L
          example: L
        default_template:
          type: boolean
          description: Whether this is the account default template
          example: false
        background_image_front_url:
          type: string
          nullable: true
          description: URL to the front background image, or null if not set
        background_image_back_url:
          type: string
          nullable: true
          description: URL to the back background image, or null if not set
        template_objects:
          type: array
          description: Free-form JSONB objects representing layout elements on this template
          items:
            type: object
        owner_id:
          type: integer
          nullable: true
          description: |
            ID of the user who owns this template, or null if unowned. Set
            server-side on create. May be reassigned via PATCH by the current
            owner or by any admin in the account; the new value must be the
            ID of an admin in the same account.
        editable_by:
          type: string
          enum:
          - owner_only
          - any_admin
          description: Who can edit this template
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Soft-delete timestamp. Null for live templates. Writable via PATCH:
            sending a non-null value soft-deletes the template; sending null
            restores it. Soft-deleted templates are excluded from index by
            default (see include_deleted).
        deleted_by_id:
          type: integer
          nullable: true
          readOnly: true
          description: |
            ID of the user who soft-deleted this template, set server-side
            from the authenticated user when deleted_at is written. Cleared
            when deleted_at is cleared.
        linked_files:
          type: array
          description: Files linked to this template (images, fonts, etc.)
          items:
            "$ref": "#/components/schemas/LinkedFile"
        created_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp.
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp.
    CardTemplateInput:
      type: object
      properties:
        card_template:
          type: object
          properties:
            uuid:
              type: string
              description: Client-generated UUID (required for creation)
            name:
              type: string
              description: Template display name (required for creation)
            template_type_id:
              type: integer
              description: ID of the template type. Prefer template_type_code for portability across environments
            template_type_code:
              type: string
              description: Code of the template type (e.g. ISO_CARD_STANDARD). Resolved server-side; takes precedence over template_type_id if both are given
              example: ISO_CARD_STANDARD
            card_type:
              type: string
              enum:
              - standard
              - signature_stripe
            double_sided:
              type: boolean
            orientation_front:
              type: string
              enum:
              - P
              - L
            orientation_back:
              type: string
              enum:
              - P
              - L
            default_template:
              type: boolean
            template_objects:
              type: array
              description: Free-form JSONB objects representing layout elements. Replaces the entire array on update
              items:
                type: object
            editable_by:
              type: string
              enum:
              - owner_only
              - any_admin
              description: Who can edit this template
            owner_id:
              type: integer
              nullable: true
              description: |
                Reassign ownership. Allowed for the current owner or any admin
                in the account. The new owner must be an admin in the same
                account. Ignored on create (owner is set server-side from the
                authenticated user).
            deleted_at:
              type: string
              format: date-time
              nullable: true
              description: |
                Soft-delete timestamp. PATCH only. Setting a non-null value
                soft-deletes the template; setting null restores it. The
                deleted_by_id field is set server-side. For permanent deletion,
                use DELETE /card_templates/{id}.
            change_request_id:
              type: string
              format: uuid
              description: Idempotency key for this change request
    CardTemplateType:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          description: Unique identifier for this type
          example: ISO_CARD
        name:
          type: string
          description: Display name
          example: Standard ISO Card
        page_size:
          type: string
          description: Physical page size category
          enum:
          - ISO_CARD
          - A4
          - A5
          - LETTER
          example: ISO_CARD
        width_mm:
          type: number
          format: float
          description: Physical width in millimetres
          example: 85.6
        height_mm:
          type: number
          format: float
          description: Physical height in millimetres
          example: 54.0
        orientation_default:
          type: string
          description: "Default orientation: P = Portrait, L = Landscape"
          enum:
          - P
          - L
          example: L
        preview_image_url:
          type: string
          nullable: true
          description: URL to a preview image, or null if not set
        non_printable_zones:
          type: array
          description: Non-printable zone definitions
          items:
            type: object
            properties:
              label:
                type: string
                description: Zone identifier
                example: signature_stripe
              x_mm:
                type: number
                format: float
                description: X position from top-left in millimetres
              y_mm:
                type: number
                format: float
                description: Y position from top-left in millimetres
              width_mm:
                type: number
                format: float
                description: Zone width in millimetres
              height_mm:
                type: number
                format: float
                description: Zone height in millimetres
        created_at:
          type: string
          format: date-time
          description: When the record was created
        updated_at:
          type: string
          format: date-time
          description: When the record was last updated
    CardTemplateTypeInput:
      type: object
      properties:
        card_template_type:
          type: object
          properties:
            code:
              type: string
              description: Unique code (required for creation)
            name:
              type: string
            page_size:
              type: string
              enum:
              - ISO_CARD
              - A4
              - A5
              - LETTER
            width_mm:
              type: number
              format: float
            height_mm:
              type: number
              format: float
            orientation_default:
              type: string
              enum:
              - P
              - L
            non_printable_zones:
              type: array
              description: Non-printable zones. Replaces the entire array on update
              items:
                type: object
                properties:
                  label:
                    type: string
                  x_mm:
                    type: number
                    format: float
                  y_mm:
                    type: number
                    format: float
                  width_mm:
                    type: number
                    format: float
                  height_mm:
                    type: number
                    format: float
    LinkedFile:
      type: object
      properties:
        uuid:
          type: string
          description: Unique identifier for this linked file
        entity_type:
          type: string
          description: Type of the parent entity
        entity_uuid:
          type: string
          description: UUID of the parent entity
        file_role:
          type: string
          description: Role of this file (e.g. background_front, background_back, logo)
        url:
          type: string
          nullable: true
          description: URL to download the file, or null if not yet uploaded
        content_type:
          type: string
          description: MIME type of the file
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  responses:
    UnauthorizedError:
      description: Unauthorized - Invalid or missing authentication
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: unauthorized
              error_description:
                type: string
                example: The access token is invalid
    ForbiddenError:
      description: Forbidden - User does not have permission
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: forbidden
              error_description:
                type: string
                example: You are not authorized to access this resource
    NotFoundError:
      description: Not Found - Resource does not exist or is not an admission request
        event
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: not_found
              error_description:
                type: string
                example: The requested resource was not found
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: internal_server_error
              error_description:
                type: string
                example: An unexpected error occurred
    UnprocessableEntityError:
      description: Unprocessable Entity - Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message
              errors:
                type: object
                description: Field-specific validation errors
                properties:
                  value:
                    type: array
                    description: Validation errors for the credential value
                    items:
                      type: string
                    example:
                    - value is already in use on your account
                    - must be between 4 and 7 digits in length
                  credential_type_id:
                    type: array
                    description: Validation errors for the credential type
                    items:
                      type: string
                    example:
                    - Not found for this account
                  limit_reached:
                    type: string
                    description: License limit error message
                    example: You have reached your HID Mobile licence limit. Please
                      contact DoorFlow Support.
    RateLimitedError:
      description: Too Many Requests - Sync rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            - description
            - retry_in
            properties:
              error:
                type: string
                enum:
                - rate_limited
                description: Error code indicating rate limiting
                example: rate_limited
              description:
                type: string
                description: Human-readable description of the rate limit
                example: Sync rate limit exceeded. Please wait before trying again.
              retry_in:
                type: integer
                description: Number of seconds to wait before retrying
                example: 60
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: "/oauth/authorize"
          tokenUrl: "/oauth/token"
          scopes: {}
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic Authentication using OAuth client credentials.

        Encode your client_id and client_secret as: `{client_id}:{client_secret}`
        using URL-safe Base64 encoding.
