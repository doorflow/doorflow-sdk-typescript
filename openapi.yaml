      - card_templates
      security:
      - OAuth2:
        - private.account.card_template.readonly
      parameters:
      - name: id
        in: path
        description: Card template ID
        required: true
        schema:
          type: integer
      - name: side
        in: path
        description: Which side of the card
        required: true
        schema:
          type: string
          enum:
          - front
          - back
      responses:
        '302':
          description: Redirect to image URL
        '404':
          description: Template or image not found
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
    put:
      summary: Upload background image
      description: Uploads or replaces the background image for the specified side.
      operationId: updateCardTemplateBackgroundImage
      tags:
      - card_templates
      security:
      - OAuth2:
        - private.account.card_template
      parameters:
      - name: id
        in: path
        description: Card template ID
        required: true
        schema:
          type: integer
      - name: side
        in: path
        description: Which side of the card
        required: true
        schema:
          type: string
          enum:
          - front
          - back
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Background image uploaded successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CardTemplate"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '422':
          "$ref": "#/components/responses/UnprocessableEntityError"
    delete:
      summary: Delete background image
      description: Removes the background image for the specified side.
      operationId: deleteCardTemplateBackgroundImage
      tags:
      - card_templates
      security:
      - OAuth2:
        - private.account.card_template
      parameters:
      - name: id
        in: path
        description: Card template ID
        required: true
        schema:
          type: integer
      - name: side
        in: path
        description: Which side of the card
        required: true
        schema:
          type: string
          enum:
          - front
          - back
      responses:
        '204':
          description: Background image deleted successfully
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
  "/api/3/card_templates/{id}/files":
    get:
      summary: List linked files
      description: Returns all files linked to a card template.
      operationId: listCardTemplateFiles
      tags:
      - card_templates
      security:
      - OAuth2:
        - private.account.card_template.readonly
      parameters:
      - name: id
        in: path
        description: Card template ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: List of linked files retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/LinkedFile"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/card_templates/{id}/files/{file_uuid}":
    put:
      summary: Upload or replace linked file
      description: Uploads or replaces a linked file for a card template. The file_role query parameter is required.
      operationId: uploadCardTemplateFile
      tags:
      - card_templates
      security:
      - OAuth2:
        - private.account.card_template
      parameters:
      - name: id
        in: path
        description: Card template ID
        required: true
        schema:
          type: integer
      - name: file_uuid
        in: path
        description: UUID of the linked file
        required: true
        schema:
          type: string
      - name: file_role
        in: query
        description: Role of the file (e.g. background_front, background_back, logo)
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LinkedFile"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '422':
          "$ref": "#/components/responses/UnprocessableEntityError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
    delete:
      summary: Delete linked file
      description: Removes a linked file from a card template.
      operationId: deleteCardTemplateFile
      tags:
      - card_templates
      security:
      - OAuth2:
        - private.account.card_template
      parameters:
      - name: id
        in: path
        description: Card template ID
        required: true
        schema:
          type: integer
      - name: file_uuid
        in: path
        description: UUID of the linked file
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Linked file deleted successfully
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/card_template_types":
    get:
      summary: List card template types
      description: Returns all available card template types. This endpoint is not paginated.
      operationId: listCardTemplateTypes
      tags:
      - card_template_types
      security:
      - OAuth2:
        - private.card_template_type.readonly
      parameters:
      - name: updated_since
        in: query
        description: ISO 8601 timestamp. Returns only types updated after this time
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: List of card template types retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/CardTemplateType"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
    post:
      summary: Create card template type
      description: Creates a new card template type. The code field must be unique.
      operationId: createCardTemplateType
      tags:
      - card_template_types
      security:
      - OAuth2:
        - private.card_template_type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CardTemplateTypeInput"
      responses:
        '201':
          description: Card template type created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CardTemplateType"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '422':
          "$ref": "#/components/responses/UnprocessableEntityError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/card_template_types/{code}":
    get:
      summary: Get card template type
      description: Returns a single card template type by its code.
      operationId: getCardTemplateType
      tags:
      - card_template_types
      security:
      - OAuth2:
        - private.card_template_type.readonly
      parameters:
      - name: code
        in: path
        description: Card template type code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Card template type retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CardTemplateType"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
    put:
      summary: Update card template type
      description: Updates an existing card template type. Submitting non_printable_zones replaces the entire zones array.
      operationId: updateCardTemplateType
      tags:
      - card_template_types
      security:
      - OAuth2:
        - private.card_template_type
      parameters:
      - name: code
        in: path
        description: Card template type code
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CardTemplateTypeInput"
      responses:
        '200':
          description: Card template type updated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CardTemplateType"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '422':
          "$ref": "#/components/responses/UnprocessableEntityError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
    delete:
      summary: Delete card template type
      description: Deletes a card template type. Fails with 409 Conflict if any card templates reference this type.
      operationId: deleteCardTemplateType
      tags:
      - card_template_types
      security:
      - OAuth2:
        - private.card_template_type
      parameters:
      - name: code
        in: path
        description: Card template type code
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Card template type deleted successfully
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
        '409':
          description: Card template type is in use by one or more card templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Card template type is in use by one or more card templates
        '500':
          "$ref": "#/components/responses/InternalServerError"
  "/api/3/sync":
    post:
      summary: Initiate sync
      description: |
        Triggers a synchronization process to push pending changes to all door controllers.
        This endpoint initiates the sync if there are unsynced changes in the account.
        The sync process is rate-limited to prevent excessive sync requests.
      operationId: initiateSync
      tags:
      - sync
      security:
      - OAuth2:
        - account.sync
      responses:
        '200':
          description: Sync initiated successfully (or no changes to sync)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: ok
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '403':
          "$ref": "#/components/responses/ForbiddenError"
        '429':
          "$ref": "#/components/responses/RateLimitedError"
        '500':
          "$ref": "#/components/responses/InternalServerError"
components:
  schemas:
    Account:
      type: object
      required:
      - id
      - name
      - time_zone
      - monitored
      - sync
      - user
      - passport
      properties:
        id:
          type: string
          description: Unique hashid identifier for the account
          example: abc123xyz
        name:
          type: string
          description: Name of the account
          example: Acme Corporation
        time_zone:
          type: string
          description: Account's time zone (IANA time zone database format)
          example: America/New_York
        monitored:
          type: boolean
          description: Whether the account is being monitored
          example: true
        reseller:
          type: object
          nullable: true
          description: Reseller information if account has an associated reseller
          properties:
            id:
              type: integer
              description: Reseller ID
            name:
              type: string
              description: Reseller name
            support_contact:
              type: string
              description: Support contact name
              nullable: true
            support_email:
              type: string
              format: email
              description: Support email address
              nullable: true
            support_telephone:
              type: string
              description: Support telephone number
              nullable: true
        sync:
          type: object
          required:
          - status
          - last_sync
          description: Synchronization status information
          properties:
            status:
              type: string
              enum:
              - complete
              - failing
              - syncing
              - pending
              description: Current sync status
            last_sync:
              type: string
              format: date-time
              nullable: true
              description: Timestamp of last sync initiation
            description:
              type: string
              nullable: true
              description: Detailed description of sync status (e.g., "2 of 5 failed")
        user:
          type: object
          required:
          - id
          - first_name
          - last_name
          - email
          description: Current authenticated user information
          properties:
            id:
              type: integer
              description: User ID
            first_name:
              type: string
              description: User's first name
            last_name:
              type: string
              description: User's last name
            email:
              type: string
              format: email
              description: User's email address
        passport:
          type: object
          required:
          - remote_unlock_enabled
          - hid_mobile_access
          description: Mobile access features configuration
          properties:
            remote_unlock_enabled:
              type: boolean
              description: Whether passport remote unlock is enabled
            hid_mobile_access:
              type: boolean
              description: Whether HID mobile access is configured
    Error:
      type: object
      required:
      - error
      - error_description
      properties:
        error:
          type: string
          description: Error code
          example: unauthorized
        error_description:
          type: string
          description: Human-readable error description
          example: The access token is invalid
    AdmissionRequest:
      type: object
      required:
      - id
      - status
      - channel_id
      - requested_at
      - door_controller
      properties:
        id:
          type: integer
          description: Unique identifier for the admission request (Event ID)
          example: 123456789
        status:
          type: string
          enum:
          - pending
          - admitted
          - denied
          - offline
          - timeout
          description: |
            Current status of the admission request:
            - pending: Waiting for door controller response
            - admitted: Person successfully admitted (event codes 15, 16, 50)
            - denied: Access denied (event code 51)
            - offline: Door controller offline (event code 52)
            - timeout: No response received within 2 minutes
          example: admitted
        channel_id:
          type: integer
          description: ID of the channel (door controller)
          example: 1340
        person_id:
          type: integer
          nullable: true
          description: ID of the person (null for general admit requests)
          example: 12345
        requested_at:
          type: string
          format: date-time
          description: Timestamp when the admission was requested
          example: '2024-01-15T14:30:00.000Z'
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the admission completed (null if still pending)
          example: '2024-01-15T14:30:02.500Z'
        door_controller:
          type: object
          description: Information about the door controller
          properties:
            id:
              type: integer
              description: Door controller ID
              example: 1340
            name:
              type: string
              description: Door controller name
              example: Front Door
        person:
          type: object
          nullable: true
          description: Information about the person (null for general admit or if
            person not found)
          properties:
            id:
              type: integer
              description: Person ID
              example: 12345
            name:
              type: string
              description: Person name
              example: John Doe
    Channel:
      type: object
      required:
      - id
      - name
      - mac_address
      - status
      - unit
      - sync
      - mode
      properties:
        id:
          type: integer
          description: Unique identifier for the channel
          example: 1340
        name:
          type: string
          description: Name of the channel/door controller
          example: Front Door
        mac_address:
          type: string
          description: MAC address of the controller (format aa:bb:cc:dd:ee:ff)
          pattern: "^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$"
          example: 00:11:22:33:44:55
        status:
          type: string
          enum:
          - online
          - offline
          - pending_encryption
          description: Current connection status of the channel
        unit:
          type: integer
          description: Unit number for multi-channel controllers
          example: 1
        model:
          type: string
          nullable: true
          description: Controller model number
          example: IPBR-2
        model_long:
          type: string
          description: Full descriptive model name
          example: 2 channel IP Controller
        serial_number:
          type: string
          nullable: true
          description: Serial number of the controller
        card_format:
          type: string
          nullable: true
          description: Card format configuration
        pin_format:
          type: string
          nullable: true
          description: PIN format configuration
        freescale_version:
          type: string
          nullable: true
          description: Freescale firmware version
        pic_version:
          type: string
          nullable: true
          description: PIC firmware version
        reader_device_class_name:
          type: string
          nullable: true
          description: Reader device class identifier
        site_id:
          type: integer
          nullable: true
          description: ID of the site this channel belongs to
        updated_at:
          type: string
          format: date-time
          description: Timestamp of last update
        created_at:
          type: string
          format: date-time
          description: Timestamp of creation
        sync:
          type: object
          required:
          - status
          - last_sync_completed_at
          description: Synchronization status information
          properties:
            status:
              type: string
              enum:
              - ok
              - fail
              - syncing
              - pending
              description: Current sync status
            last_sync_completed_at:
              type: string
              format: date-time
              nullable: true
              description: Timestamp of last successful sync completion
        lockdown:
          type: object
          nullable: true
          description: Lockdown mode configuration (null if not in lockdown)
          properties:
            message:
              type: string
              description: Lockdown status message
              example: Cards and PINs will be rejected
            card_lockdown:
              type: object
              properties:
                state:
                  type: boolean
                  description: Whether card access is locked down
            rex_lockdown:
              type: object
              properties:
                state:
                  type: boolean
                  description: Whether REX (Request to Exit) is locked down
            aux_lockdown:
              type: object
              properties:
                state:
                  type: boolean
                  description: Whether auxiliary input is locked down
        mode:
          type: object
          required:
          - description
          description: Current operating mode of the channel
          properties:
            description:
              type: string
              enum:
              - unlock
              - normal
              description: Current mode
            relock_at:
              type: string
              format: date-time
              nullable: true
              description: Time when door will automatically relock (if in unlock
                mode)
            change_stamp:
              type: string
              format: date-time
              nullable: true
              description: Timestamp when mode was last changed
        auto_unlock:
          type: object
          nullable: true
          description: Auto-unlock shift configuration (null if not configured)
          properties:
            id:
              type: integer
              description: Shift ID
            name:
              type: string
              description: Shift name
    CardDesign:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          description: Unique identifier for the card design
          example: 42
        name:
          type: string
          description: Name of the card design
          example: Standard Blue Card
        notes:
          type: string
          nullable: true
          description: Free-text notes about the card design
          example: Used for full-time employees
        image_front:
          type: object
          nullable: true
          description: Front image URLs at multiple sizes, or null if no image is set
          properties:
            original:
              type: string
              description: Original uploaded image URL
            medium:
              type: string
              description: Medium size (600x378) image URL
            small:
              type: string
              description: Small size (300x189) image URL
            thumb:
              type: string
              description: Thumbnail size (150x94) image URL
        image_back:
          type: object
          nullable: true
          description: Back image URLs at multiple sizes, or null if no image is set
          properties:
            original:
              type: string
              description: Original uploaded image URL
            medium:
              type: string
              description: Medium size (600x378) image URL
            small:
              type: string
              description: Small size (300x189) image URL
            thumb:
              type: string
              description: Thumbnail size (100x94) image URL
        created_at:
          type: string
          format: date-time
          description: Timestamp of creation
        updated_at:
          type: string
          format: date-time
          description: Timestamp of last update
    CardDesignInput:
      type: object
      properties:
        name:
          type: string
          description: Name of the card design (required for creation)
          example: Standard Blue Card
        notes:
          type: string
          nullable: true
          description: Free-text notes about the card design
        image_front_base64:
          type: string
          nullable: true
          description: Base64-encoded image data for the front of the card (data URI format, e.g. data:image/png;base64,...)
        image_back_base64:
          type: string
          nullable: true
          description: Base64-encoded image data for the back of the card (data URI format, e.g. data:image/png;base64,...)
    CredentialType:
      type: object
      required:
      - id
      - label
      - slug
      - code
      properties:
        id:
          type: integer
          description: Unique identifier for the credential type
          example: 5
        label:
          type: string
          description: Human-readable label for the credential type (must be unique
            within account)
          example: Employee Card
        slug:
          type: string
          description: URL-friendly identifier used in API requests (must be unique
            within account, auto-parameterized)
          example: employee_card
        code:
          type: integer
          nullable: true
          description: Numeric code from the associated global credential type
          example: 100
    Credential:
      type: object
      required:
      - id
      - credential_type_id
      - person_id
      - label
      properties:
        id:
          type: string
          description: Unique hashid identifier for the credential
          example: abc123xyz
        credential_type_id:
          type: integer
          description: ID of the credential type
          example: 5
        label:
          type: string
          description: Human-readable label for the credential type
          example: Card Number
        person_id:
          type: integer
          description: ID of the person this credential belongs to
          example: 12345
        value:
          type: string
          nullable: true
          description: Credential value (only present for value-assignable credential
            types like cards, PINs, etc. Not present for mobile credentials)
          example: '1234567890'
        status:
          type: string
          nullable: true
          description: Status for mobile credentials
          enum:
          - invited
          - active
          - revoking
          - revoked
          - added_to_wallet
          example: invited
        url:
          type: string
          nullable: true
          description: PassFlow credential URL (only for PassFlow credentials in invited
            state)
        wallet_type:
          type: string
          nullable: true
          description: Wallet type for PassFlow credentials that have been added to
            wallet
          enum:
          - apple
          - google
    CredentialInput:
      type: object
      required:
      - person_credential
      properties:
        person_credential:
          type: object
          required:
          - credential_type_id
          properties:
            credential_type_id:
              type: integer
              description: ID of the credential type (required)
              example: 5
            value:
              type: string
              nullable: true
              description: Credential value (for card numbers, PINs, etc. Use "******"
                to auto-generate a random PIN)
              example: '1234567890'
            person_id:
              type: integer
              nullable: true
              description: Person ID (typically derived from URL path parameter)
    CredentialUpdateInput:
      type: object
      required:
      - person_credential
      properties:
        person_credential:
          type: object
          required:
          - value
          properties:
            value:
              type: string
              description: New credential value
              example: '9876543210'
    Event:
      type: object
      required:
      - id
      - event_code
      - event_label
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          description: Unique identifier for the event
          example: 123456789
        event_id:
          type: integer
          nullable: true
          description: Same as id (legacy field for backward compatibility)
          example: 123456789
        event_code:
          type: integer
          description: |
            Numeric code identifying the event type. Common codes:
            - 10-18: Admit events (card, PIN, manual, REX, AUX, application, unlocked, Apple, Google)
            - 20-29: Reject events (card, out of hours, lockdown, tamper, PIN, timeout, invalid type, unauthorized, pass-back, offline)
            - 30: REX pressed
            - 31-37: Door state/alarm events
            - 40-42: Auto-unlock shift events
            - 50-63: Remote control events
            - 70-73: Multi-factor authentication events
            - 90-91: Tamper events
            - 100-107: Channel sync events
          example: 10
        event_label:
          type: string
          description: Human-readable description of the event
          example: John Doe admitted using card
        door_controller_id:
          type: integer
          nullable: true
          description: ID of the door controller (channel) where the event occurred
          example: 1340
        door_controller_name:
          type: string
          nullable: true
          description: Name of the door controller (channel)
          example: Front Door
        channel_id:
          type: integer
          nullable: true
          description: Alias for door_controller_id
          example: 1340
        channel_name:
          type: string
          nullable: true
          description: Alias for door_controller_name
          example: Front Door
        person_id:
          type: integer
          nullable: true
          description: ID of the person associated with this event (for access events)
          example: 12345
        person_name:
          type: string
          nullable: true
          description: Name of the person associated with this event
          example: John Doe
        credentials_number:
          type: string
          nullable: true
          description: Credential number used (card number, PIN, etc.)
          example: '1234567890'
        created_at:
          type: string
          format: date-time
          description: Timestamp when the event occurred
          example: '2024-01-15T14:30:00.000Z'
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the event record was last updated
          example: '2024-01-15T14:30:00.000Z'
    GroupReservation:
      type: object
      required:
      - id
      - person_id
      - start_time
      - end_time
      - state
      - group_ids
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          description: Unique identifier for the group reservation
          example: 456
        person_id:
          type: integer
          description: ID of the person assigned to the groups
          example: 12345
        start_time:
          type: string
          format: date-time
          description: Start time of the group reservation
          example: '2024-01-15T09:00:00.000Z'
        end_time:
          type: string
          format: date-time
          description: End time of the group reservation (must be after start time
            and in the future)
          example: '2024-01-15T17:00:00.000Z'
        state:
          type: string
          enum:
          - pending
          - active
          - deactivated
          description: Current state of the reservation (pending = not started, active
            = in progress, deactivated = cancelled or completed)
          example: active
        group_ids:
          type: array
          description: Array of group IDs the person is assigned to during this reservation
          items:
            type: integer
          example:
          - 1
          - 3
          - 5
        created_at:
          type: string
          format: date-time
          description: Timestamp of creation
        updated_at:
          type: string
          format: date-time
          description: Timestamp of last update
    GroupReservationInput:
      type: object
      required:
      - group_reservation
      properties:
        group_reservation:
          type: object
          required:
          - person_id
          - start_time
          - end_time
          - group_ids
          properties:
            person_id:
              type: integer
              description: ID of the person to assign to groups (must belong to the
                same account)
              example: 12345
            start_time:
              type: string
              format: date-time
              description: Start time of the group reservation
              example: '2024-01-15T09:00:00.000Z'
            end_time:
              type: string
              format: date-time
              description: End time of the group reservation (must be after start
                time and in the future)
              example: '2024-01-15T17:00:00.000Z'
            group_ids:
              type: array
              description: Array of group IDs to assign the person to (at least one
                required, all must belong to the account)
              items:
                type: integer
              minItems: 1
              example:
              - 1
              - 3
              - 5
    ElementSessionInput:
      type: object
      required:
        - widget_type
        - member
      properties:
        widget_type:
          type: string
          enum: [admin, member]
          description: |
            Which widget kind this session authorises. `admin` exposes
            credential issue/revoke and group management; `member` exposes
            wallet provisioning and self-deactivation.
          example: member
        member:
          "$ref": "#/components/schemas/ElementSessionMember"
        identity_assertion:
          type: string
          nullable: true
          description: |
            Optional partner-signed JWT (RFC 7521 / RFC 7523) carrying
            verified-identity claims. When present and verified against
            the partner's published JWKS, downstream wallet provisioning
            may skip its own SMS verification step.
        platform:
          type: string
          enum: [apple, google]
          nullable: true
          description: |
            Optional platform hint. Only honoured by the iOS-side
            `/sdk/button` host page; ignored by the JS shell.
        config:
          "$ref": "#/components/schemas/ElementSessionConfig"
        credentials:
          type: array
          nullable: true
          description: |
            Optional explicit credential-type slugs (or well-known aliases)
            to expose in the widget. Defaults to all wallet-eligible types
            for the requested widget kind.
          items:
            type: string
          example: ["mobile_access", "pin"]
    ElementSessionMember:
      type: object
      required:
        - external_id
      properties:
        external_id:
          type: string
          description: |
            The integrator's CRM-side identifier for the person. DoorFlow
            stores this on `Person.organisation_id` and uses it for
            find-or-create on subsequent calls.
          example: "u_42"
        name:
          type: string
          description: Person's full name. Used when creating a new Person record.
          example: "Alice Smith"
        email:
          type: string
          format: email
          nullable: true
          description: Person's email. Used when creating a new Person and to claim an existing unlinked Person with the same email.
          example: "alice@example.com"
    ElementSessionConfig:
      type: object
      additionalProperties: false
      description: |
        Theme and widget-configuration flags. Each value is validated
        on the server; invalid values fall back to defaults rather than
        rejecting the session.
      properties:
        theme:
          type: string
          enum: [light, dark, auto]
          default: light
        accent_color:
          type: string
          description: 3- or 6-digit hex (e.g. `#FF6600`).
          example: "#FF6600"
        border_radius:
          type: integer
          minimum: 0
          maximum: 64
          default: 8
        font_family:
          type: string
          description: |
            CSS font-family stack. Restricted to letters, digits, hyphens,
            spaces, commas, and single quotes.
          example: "Inter, -apple-system, sans-serif"
        manage_groups:
          type: boolean
          default: true
        show_member:
          type: boolean
          default: true
    ElementSession:
      type: object
      required:
        - token
        - expires_in
      properties:
        token:
          type: string
          description: Short-lived JWT to forward to the widget shell.
          example: "eyJhbGciOiJIUzI1NiJ9..."
        expires_in:
          type: integer
          description: Seconds until the token expires.
          example: 900
    ElementSessionError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - no_eligible_credentials
            - assertion_replayed
            - assertion_expired
            - assertion_subject_mismatch
            - assertion_signature_invalid
            - jwks_unavailable
          description: |
            Typed error code so SDK callers can branch without parsing
            the human-readable message.
        message:
          type: string
          description: Human-readable description of the error.
    Group:
      type: object
      required:
      - id
      - name
      - global_across_sites
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          description: Unique identifier for the group
          example: 15
        name:
          type: string
          description: Name of the group (must be present)
          example: Marketing Team
        notes:
          type: string
          nullable: true
          description: Additional notes about this group
          example: Access to marketing floor and conference rooms
        global_across_sites:
          type: boolean
          description: Whether this group applies across all sites in multi-site deployments
          example: false
        created_at:
          type: string
          format: date-time
          description: Timestamp of creation
        updated_at:
          type: string
          format: date-time
          description: Timestamp of last update
    NotificationRule:
      type: object
      required:
      - id
      - name
      - active
      - conditions
      - events
      - actions
      properties:
        id:
          type: integer
          description: Unique identifier for the notification rule
          example: 100
        name:
          type: string
          description: Name of the notification rule
          example: Webhook for door access events
        active:
          type: boolean
          description: Whether this notification rule is currently active
          example: true
        conditions:
          type: array
          description: Conditions that must be met for the rule to trigger
          items:
            type: object
            properties:
              type:
                type: string
                description: Type of condition (e.g., "door_controller_id")
                example: door_controller_id
              type_description:
                type: string
                description: Human-readable description of the condition type
                example: Door Controller
              value:
                type: string
                description: Value to match against
                example: '1340'
        events:
          type: array
          description: Events that trigger this rule (at least one required)
          items:
            type: object
            properties:
              code:
                type: integer
                description: Event code that triggers this rule
                example: 10
              name:
                type: string
                description: Human-readable name of the event
                example: Admit Card
          minItems: 1
        actions:
          type: array
          description: Actions to perform when the rule triggers (at least one required)
          items:
            type: object
            properties:
              type:
                type: integer
                description: Type of action (0 = webhook callback)
                example: 0
              type_description:
                type: string
                description: Human-readable description of the action type
                example: Callback URL
              data:
                type: string
                description: Action data (e.g., webhook URL)
                example: https://example.com/webhook
          minItems: 1
    NotificationRuleInput:
      type: object
      required:
      - name
      - call_back_url
      - match_event_codes
      properties:
        name:
          type: string
          description: Name of the notification rule (required)
          example: Webhook for door access events
        active:
          type: boolean
          description: Whether this notification rule is active
          default: true
          example: true
        call_back_url:
          type: string
          format: uri
          description: Webhook callback URL to trigger when events occur (required)
          example: https://example.com/webhook
        match_event_codes:
          type: array
          description: Array of event codes that trigger this rule (at least one required)
          items:
            type: integer
          minItems: 1
          example:
          - 10
          - 11
          - 20
        match_controller_ids:
          type: array
          description: Array of door controller IDs to filter events (optional - if
            omitted, matches all controllers)
          items:
            type: integer
          example:
          - 1340
          - 1341
